<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Практика: flexbox и блочная модель</title>

    <style>
        :root {
            --primary: #1F6FB0;
            --bg: #F5F7FA;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg);
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: #666;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header nav {
            display: flex;
            gap: 15px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: var(--primary);
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
        }

        .card {
            background: #fff;
            padding: 20px;
            border: 2px solid var(--primary);
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            flex: 1;
        }

        .row {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h2>Сайт</h2>
        <nav>
            <a href="#">главная</a>
            <a href="#">контакты</a>
        </nav>
    </header>

    <main class="container">
        <section>
            <h2>карточки с flexbox</h2>
            <div class="row">
                <div class="card">
                    <h3>блок 1</h3>
                    <p>благодаря flex: 1 они делят пространство</p>
                </div>
            </div>
        </section>

        <section style="margin-top: 30px;">
            <a href="#" class="btn">кнопка (inline-block)</a>
        </section>
    </main>

</body>
</html>
